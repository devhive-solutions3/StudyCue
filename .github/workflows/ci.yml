name: StudyCue CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  web-checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      EXPO_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:dummy
      EXPO_PUBLIC_FIREBASE_API_KEY: dummy
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: dummy
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:dummy
      NEXT_PUBLIC_AI_PROXY_URL: /api/cue
      EXPO_PUBLIC_AI_PROXY_URL: /api/cue
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint web app
        run: npm --prefix web run lint

      - name: Typecheck web app
        run: npx tsc -p web/tsconfig.json --noEmit

      - name: Build web app
        run: npm --prefix web run build
